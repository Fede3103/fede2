services:
  - type: web
    name: fedekeanu
    rootDir: fedekeanu-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /tmp/fedekeanu.sqlite3
      - key: TRUST_PROXY
        value: "1"
